name: Regenerate worked calculations

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libssl-dev libxml2-dev libcurl4-openssl-dev libuv1-dev \
            libpng-dev libtiff-dev libjpeg-dev libwebp-dev pkg-config

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install R package dependencies
        env:
          R_REPOS: "https://cloud.r-project.org"
        run: |
          Rscript -e 'if (!requireNamespace("remotes", quietly = TRUE)) install.packages("remotes")'
          Rscript -e 'remotes::install_deps(dependencies = TRUE)'

      - name: Run worked-calculation generator
        run: |
          Rscript scripts/generate-worked-calculations.R

      - name: Show changed files
        run: |
          git status --porcelain
          git --no-pager diff --name-only

      - name: Commit regenerated files
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Regenerate worked-calculations (CI)"
          branch: regen-worked-calculations
          file_pattern: generated/worked-calculations/**
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>