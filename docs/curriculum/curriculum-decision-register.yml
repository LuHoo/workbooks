  - id: "CURR-009"
    title: "Shift from calculation-focused to judgment-focused learning objectives"
    domain:
      - "audit-judgement"
      - "bloom-taxonomy"
      - "learning-objectives"
    decision: >
      Learning objectives in audit-focused chapters should emphasize higher-order
      Bloom levels (evaluate, analyze, create) over lower levels (remember, understand, apply).
      Objectives should frame capabilities in terms of professional judgment rather than
      procedural execution.
    status: "proposed"
    confidence: "medium"
    rationale: >
      Auditors need judgment and interpretation skills more than calculation skill.
      Objectives focused on "calculate" or "perform" risk producing students who can
      execute procedures without understanding or questioning them. Judgment-focused
      objectives orient students toward professional reasoning.
    implications:
      - "Regression chapter should have objectives like 'evaluate model reliability' not 'calculate F-statistic'."
      - "Workshop exercises should require interpretation and decision-making, not just computation."
      - "Review questions should assess judgment and critical evaluation, not rote calculation."
      - "Lower-Bloom procedural skills become supporting details, not chapter endpoints."
    applies_to:
      - "chapters"
      - "learning-objectives"
      - "workshops"
      - "exercises"
      - "review-questions"
    evidence:
      - source_type: "repository-file"
        path: "docs/traceability/regression-learning-objectives-review.md"
        lines: "L97-L110"
        heading: "Proposed objective 1: Model appropriateness"
        quotation: >
          Determine whether regression analysis is suitable for a given audit problem...
          Suggested Bloom level: evaluate
    related_decisions:
