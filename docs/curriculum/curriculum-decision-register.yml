  - id: "CURR-020"
    title: "Generated content never becomes independent source of truth"
    domain:
      - "curriculum-governance"
      - "quality-assurance"
    decision: >
      No generated artefact (distribution notebooks, book LaTeX, exported exercises,
      rendered output) may be edited independently and become an authoritative version.
      All corrections must flow back to the canonical source.
    status: "confirmed"
    confidence: "high"
    rationale: >
      Once generated content becomes independently maintained, consistency fractures.
      Authors become confused about which version is authoritative. Divergence accumulates
      silently. Governance breaks down.
    implications:
      - "Distribution notebooks must never be hand-edited."
      - "Book LaTeX must never be edited outside the generation pipeline."
      - "Corrections to exercises must be made in support.Rmd, then regenerated."
      - "Generated files should be git-ignored or clearly marked as non-editable."
    applies_to:
