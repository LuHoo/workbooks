  - id: "CURR-005"
    title: "Statistical technique must connect to audit evidence and professional judgment"
    domain:
      - "educational-purpose"
      - "audit-judgement"
      - "statistical-foundations"
    decision: >
      Every statistical technique covered in the curriculum must be explicitly connected
      to its implications for audit evidence, the strength of that evidence, and the
      professional judgments that an auditor must make based on that evidence.
      Techniques are not taught as ends in themselves.
    status: "confirmed"
    confidence: "high"
    rationale: >
      The curriculum prepares auditors, not statisticians. A technique's value lies
      in how it informs audit conclusions. Mechanical mastery of procedures without
      understanding their audit role produces incompetent practitioners.
    implications:
      - "No chapter should teach a technique without explaining its audit application."
      - "Worked examples should culminate in an audit decision or conclusion."
      - "Exercises should require interpretation of results for audit purposes, not just calculation."
      - "Learning objectives should emphasize evaluation and judgment, not calculation."
    applies_to:
      - "chapters"
      - "workshops"
      - "exercises"
      - "manuscript"
    evidence:
      - source_type: "repository-file"
        path: "docs/traceability/regression-learning-objectives-review.md"
        lines: "L1-L13"
        heading: "Purpose"
        quotation: >
          This document reviews the current learning objectives for the Regression Analysis
          chapter and proposes a reduced, judgement-oriented replacement set. The aim is to
          align the objectives with the chapter's educational purpose: preparing auditors to
          evaluate regression analysis as audit evidence, rather than merely perform
          regression calculations.
    related_decisions:
      supports: ["CURR-009", "CURR-010"]
      depends_on: []
      qualifies: ["CURR-008"]
      conflicts_with: []
      supersedes: []
      superseded_by: []
    open_questions:
