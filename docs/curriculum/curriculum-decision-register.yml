      proposal but status of full implementation across chapters is unclear.

  - id: "CURR-010"
    title: "Regression chapter restructuring around audit judgment"
    domain:
      - "audit-judgement"
      - "chapter-architecture"
      - "learning-objectives"
    decision: >
      The Regression Analysis chapter (Chapter 5/7) should be restructured to organize
      content around six core professional capabilities: model appropriateness, model
      reliability, interpretation, anomaly investigation, expectation and uncertainty,
      and audit conclusion. Lower-Bloom procedural skills (e.g., stepwise regression,
      F-test calculation) should become supporting details.
    status: "proposed"
    confidence: "medium"
    rationale: >
      The current section-level structure emphasizes statistical procedures and
      assumptions over the audit judgments that auditors actually make. A
      judgment-centered restructuring reduces cognitive load and ensures that
      statistical concepts remain connected to audit reasoning.
    implications:
      - "Chapter 5/7 requires restructuring; not a simple objective substitution."
      - "Some procedural sections may be condensed or moved to appendices."
      - "Worked examples must culminate in audit conclusions, not just regression output."
      - "Assessment (review questions) must test judgment, not calculation."
    applies_to:
      - "chapters"
      - "manuscript"
      - "workshops"
      - "learning-objectives"
    evidence:
