  - id: "CURR-012"
    title: "Learning objective identifiers are stable and never repurposed"
    domain:
      - "curriculum-governance"
      - "quality-assurance"
    decision: >
      Learning objective IDs (format: LO-C{chapter}-NN or LO-C{chapter}S{section}-NN)
      are permanent once assigned. IDs are never reassigned to different objectives,
      even if the original objective text changes or the objective is retired.
    status: "confirmed"
    confidence: "high"
    rationale: >
      Stable IDs allow reliable tracking over time. Historical data about which students
      learned which objectives, which exercises mapped to which objectives, and which
      assessments measured which objectives depend on ID immutability.
    implications:
      - "Objective text may be revised, but ID stays the same."
      - "Retired objectives retain their IDs with status: retired."
      - "IDs are internal identifiers, not exposed to students."
      - "Curriculum mapping reports remain valid across multiple editions."
    applies_to:
      - "learning-objectives"
      - "curriculum-governance"
    evidence:
