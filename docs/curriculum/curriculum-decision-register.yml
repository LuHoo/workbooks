  - id: "CURR-008"
    title: "Learning objectives serve as curriculum alignment anchor"
    domain:
      - "learning-objectives"
      - "curriculum-sequencing"
      - "assessment"
    decision: >
      Learning objectives are the anchor for curriculum alignment. They define intended
      student capabilities; workshops and exercises develop those capabilities;
      review questions and assessments measure achievement of them.
      Learning objectives must be explicitly mapped to supporting activities.
    status: "confirmed"
    confidence: "high"
    rationale: >
      Constructive alignment—alignment of learning objectives, teaching methods, and
      assessment—is a prerequisite for coherent curriculum. Explicit traceability prevents
      gaps where capabilities are taught but not assessed, or assessed without teaching.
    implications:
      - "Every learning objective should have traceable evidence of instruction (workshop or manuscript)."
      - "Most learning objectives should have assessment (review question or workshop exercise)."
      - "Gaps in mapping indicate either missing instruction, missing assessment, or misaligned objectives."
      - "Learning objective coverage reports are authoritative curriculum documentation."
    applies_to:
      - "whole-curriculum"
      - "learning-objectives"
      - "workshops"
      - "review-questions"
      - "assessment"
    evidence:
      - source_type: "repository-file"
        path: "docs/traceability/learning-objective-metadata-model.md"
        lines: "L7-L13"
        heading: "Goals"
        quotation: >
          Create stable identifiers for learning objectives, workshop exercises, and review questions.
          Support many-to-many mappings between objectives and activities.
          Enable deterministic automated reporting and validation in the exporter.
    related_decisions:
