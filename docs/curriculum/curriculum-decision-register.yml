  - id: "CURR-007"
    title: "Workshop exercises are distinct from review questions"
    domain:
      - "exercise-design"
      - "review-questions"
      - "assessment"
    decision: >
      Workshop exercises and chapter review questions serve distinct pedagogical purposes.
      Workshop exercises are guided, directed activities embedded in the learning sequence.
      Review questions are cumulative, independent assessment items at chapter end.
      They are not duplicates and should not be force-fit to align one-to-one.
    status: "inferred"
    confidence: "medium"
    rationale: >
      Workshop exercises scaffold learning within the chapter narrative. Review questions
      assess whether students have retained and can apply knowledge independently. These
      roles are pedagogically distinct. Forced alignment between them risks degrading both.
    implications:
      - "A chapter may have more workshop exercises than review questions (and vice versa)."
      - "Learning objectives may map to workshop exercises, review questions, or both, depending on intent."
      - "A single learning objective need not have a corresponding review question."
      - "Not all review questions need to trace to a workshop exercise."
    applies_to:
      - "workshops"
      - "exercises"
      - "review-questions"
      - "learning-objectives"
    evidence:
