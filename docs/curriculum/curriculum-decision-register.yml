  - id: "CURR-021"
    title: "Learning Objective Authoring Standard is authoritative curriculum policy"
    domain:
      - "learning-objectives"
      - "curriculum-governance"
      - "quality-assurance"
      - "bloom-taxonomy"
      - "competency-model"
    decision: >
      The document docs/curriculum/learning-objective-authoring-standard.md is
      adopted as the authoritative learning-objective policy for authoring,
      classification, validation, and governance across the ADA curriculum.
      Active learning objectives exist only at chapter level. Section-level and
      workshop-level learning objectives are retired from the active curriculum
      architecture. Every active learning objective must include mandatory Bloom
      and competency classification and must comply with binding validation
      rules LO-001 through LO-012. The competency model is fixed exclusively to
      technical_skills, statistical_reasoning, and professional_judgment.
      Audit Judgment is governed as a specialized form of
      professional_judgment and does not introduce a separate competency
      category. Non-compliant learning objectives must be corrected before
      inclusion in canonical curriculum metadata, and automated validation is
      required before publication. Any new competency category requires a
      formal curriculum decision.
    status: "confirmed"
    confidence: "high"
    rationale: >
      Existing LO governance had unresolved ambiguity around scope (chapter vs.
      section), inconsistent competency metadata coverage, and incomplete
      traceability linkage. The LO compliance audit established a measurable
      baseline (114 active LOs; 11 legacy section-level active LOs; 97 LOs
      without explicit traceability links; competency and metadata conformance
      gaps). A single binding policy is required to govern migration, enforce
      consistency, and provide auditable control points for future LO changes.
    implications:
      - "The LO authoring standard is now the canonical governance source for LO policy."
      - "All future LO changes must be evaluated against LO-001 to LO-012 before acceptance."
      - "Future learning-objective modifications must comply with the LO authoring standard before inclusion in canonical metadata."
      - "Active section-level and workshop-level LOs are not part of the active model and are governed as legacy migration artifacts."
      - "Bloom classification and competency classification are mandatory fields for active LOs."
      - "Competency vocabulary is restricted to technical_skills, statistical_reasoning, and professional_judgment."
      - "Audit Judgment is represented within professional_judgment, not as a fourth competency."
      - "Legacy section-level objectives should be retained as retired aliases where repository conventions permit to preserve traceability and audit history."
      - "Historical curriculum records should not be deleted as the primary migration policy."
      - "Automated validation is required before publication and failures are blocking defects."
      - "New competency categories require formal governance approval through a curriculum decision."
      - "LO compliance audits become a recurring governance control, not a one-time exercise."
    applies_to:
      - "whole-curriculum"
      - "learning-objectives"
      - "curriculum-governance"
      - "quality-assurance"
      - "assessment"
    evidence:
      - source_type: "repository-file"
        path: "docs/curriculum/learning-objective-authoring-standard.md"
        lines: "L1-L220"
        heading: "Purpose and Authority; Scope; Competency Model; Validation Rules"
        quotation: >
          This standard defines the canonical rules for learning-objective
          authoring, classification, review, and validation. LOs MUST exist only
          at chapter level. Competency model is fixed to Technical Skills,
          Statistical Reasoning, and Professional Judgment. Validation rules
          LO-001 through LO-012 are normative controls.
      - source_type: "repository-file"
        path: "docs/curriculum/lo-compliance-audit.md"
        lines: "L1-L140"
        heading: "Executive Summary; Rule-Level Findings"
        quotation: >
          114 active learning objectives were audited. 11 active section-level
          objectives remain. 97 active objectives have no explicit traceability
          links. Competency-classification and metadata conformance gaps are
          present.
      - source_type: "repository-file"
        path: "metadata/traceability/learning_objectives.yml"
        lines: null
        heading: null
        quotation: >
          Current active LO metadata includes both chapter and section scope
          records and mixed competency field coverage.
    related_decisions:
      supports: ["CURR-004", "CURR-008", "CURR-012", "CURR-014"]
      depends_on: ["CURR-004", "CURR-008", "CURR-012", "CURR-014", "CURR-013"]
      qualifies: ["CURR-005", "CURR-007", "CURR-015"]
      conflicts_with: []
      supersedes: ["CURR-011"]
      superseded_by: []
    implementation_notes:
      - "Phase 1 - Adopt CURR-021: Publish decision and treat LO standard as binding policy in governance workflows."
      - "Phase 2 - Retire legacy section-level objectives: remove section-level objectives from active architecture and preserve governed aliases for history where permitted."
      - "Phase 3 - Remediate competency metadata: resolve missing or invalid competency metadata for all active LOs."
      - "Phase 4 - Remediate traceability: resolve explicit LO-to-workshop and LO-to-review link gaps under validation control."
      - "Phase 5 - Chapter-level objective redesign where appropriate: perform scoped redesign only after governance and remediation controls are in place."
      - "Phase 6 - Re-audit: Execute a full LO compliance re-audit and publish updated baseline metrics."
    migration_requirements:
      - phase: "Phase 1"
        objective: "Adopt CURR-021 as binding policy."
        deliverables:
          - "Updated curriculum-decision-register.yml with CURR-021."
          - "Governance notice linking to learning-objective-authoring-standard.md."
        success_criteria:
          - "CURR-021 status is confirmed and referenced in LO governance workflow."
      - phase: "Phase 2"
        objective: "Retire legacy section-level objectives from active architecture."
        deliverables:
          - "Disposition list for all legacy section-level LOs (retire-and-alias policy where permitted)."
          - "Updated active LO set where scope is chapter-only."
        success_criteria:
          - "Zero active section-level or workshop-level LO records remain."
      - phase: "Phase 3"
        objective: "Resolve competency metadata gaps."
        deliverables:
          - "Complete competency field coverage for all active LOs using approved vocabulary."
        success_criteria:
          - "No active LO fails mandatory competency classification checks."
      - phase: "Phase 4"
        objective: "Resolve traceability gaps."
        deliverables:
          - "Updated mapping files with explicit links or approved exceptions."
        success_criteria:
          - "Every active LO has explicit instructional/assessment traceability or approved exception record."
      - phase: "Phase 5"
        objective: "Perform chapter-level objective redesign where appropriate."
        deliverables:
          - "Chapter-level redesign proposals and approved update plans for targeted chapters."
        success_criteria:
          - "Approved chapter-level redesigns preserve governance compliance and maintain identifier/traceability controls."
      - phase: "Phase 6"
        objective: "Re-audit compliance baseline."
        deliverables:
          - "Updated lo-compliance-audit.md and lo-compliance-audit.yml baseline."
        success_criteria:
          - "Governance can demonstrate measurable reduction of LO violations versus the current baseline."
    validation_impact:
      - "LO-001 to LO-012 become binding controls for LO acceptance and review."
      - "Validation pipelines must treat missing Bloom/competency/scope non-compliance as blocking defects."
      - "Compliance reporting must include rule-level pass/fail/needs-review counts and trend tracking across audits."
    open_questions:
      - "What threshold policy should govern accepted temporary traceability exceptions during migration phases?"
      - "What review cadence (for example quarterly or per release) will be mandated for recurring LO compliance audits?"
    notes: >
      Relationship classification for CURR-004, CURR-008, CURR-011, CURR-012,
      and CURR-014: CURR-021 depends_on and supports CURR-004/008/012/014 by
      operationalizing their controls; CURR-021 supersedes CURR-011 only for
      the mixed-scope interpretation that allows chapter-level and section-level
      active LOs to coexist.

  - id: "CURR-022"
    title: "Curriculum progression is governed at sequence level, not inferred from local chapter compliance"
    domain:
      - "curriculum-governance"
      - "educational-purpose"
      - "learning-objectives"
      - "assessment"
      - "curriculum-sequencing"
    decision: >
      Curriculum progression is a programme-level governance concern and must be
      evaluated across chapter sequences, not only within individual chapters.
      Chapter purpose remains primary, and chapter-to-chapter symmetry in Bloom
      or competency profiles is not a default quality target. Bloom taxonomy and
      competency classifications are required diagnostic indicators, but they are
      not the governing definition of progression. Advanced technical chapters
      must include explicit bridge objectives connecting technical execution to
      evidential interpretation and reliability evaluation. Reviewers are
      authorized to require remediation of progression weaknesses even when local
      chapter compliance is satisfied.
    status: "proposed"
    confidence: "high"
    rationale: >
      Repository curriculum reviews indicate the programme is broadly sound but
      exhibits excessive chapter-to-chapter regularization. Aggregate chapter
      balance can obscure weak developmental progression, particularly where
      chapter structures, Bloom distributions, and competency profiles become too
      symmetrical. A governance decision is needed to protect chapter-specific
      educational purpose while making progression visible along the programme
      spine: Perform -> Interpret -> Evaluate.
    implications:
      - "Curriculum quality reviews must include sequence-level progression analysis, not chapter-local checks only."
      - "Chapter educational purpose governs LO architecture; symmetry must be justified, not assumed."
      - "Bridge-objective checks become required in advanced technical chapters."
      - "Reviewer authority explicitly includes progression remediation requests despite local compliance pass status."
      - "Curriculum guidance remains principle-based and avoids rigid numeric quotas."
      - "Professional_judgment progression remains gradual across the programme, with stronger operational emphasis in Volume 2."
    applies_to:
      - "whole-curriculum"
      - "chapters"
      - "learning-objectives"
      - "assessment"
      - "curriculum-governance"
    evidence:
      - source_type: "repository-file"
        path: "docs/curriculum/curr-022-curriculum-progression-governance.md"
        lines: "L1-L260"
        heading: "CURR-022 decision record"
        quotation: >
          Progression is defined primarily as conceptual and cognitive
          development in student capability, aligned to Perform -> Interpret ->
          Evaluate. Bloom and competency classifications are diagnostic
          instruments rather than the governing definition of progression.
    related_decisions:
      supports: ["CURR-005", "CURR-008", "CURR-014", "CURR-021"]
      depends_on: ["CURR-004", "CURR-008", "CURR-021"]
      qualifies: ["CURR-004"]
      conflicts_with: []
      supersedes: []
      superseded_by: []
    open_questions:
      - "What review cadence should be mandatory for sequence-level progression audits?"
      - "What standard rubric should reviewers use to evaluate bridge-objective quality across chapters?"
      - "How should justified progression exceptions be documented in routine chapter-review workflows?"
    notes: >
      CURR-022 is intentionally non-prescriptive in numerical terms. It governs
      progression through chapter-purpose alignment, sequence-level review, and
      bridge-objective visibility.
