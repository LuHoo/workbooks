  - id: "CURR-013"
    title: "Metadata is author-editable and diff-friendly"
    domain:
      - "curriculum-governance"
      - "quality-assurance"
    decision: >
      Learning objective and traceability metadata (YAML, structured text) must be
      author-editable without special tools and must produce clean, readable diffs
      when changed. Metadata format should not create barriers to curriculum updates.
    status: "confirmed"
    confidence: "high"
    rationale: >
      Curriculum designers and instructors should own their curriculum documentation.
      If metadata requires special tools or produces unreadable diffs, it will be
      neglected and become unreliable.
    implications:
      - "Metadata must use simple, open formats (YAML, Markdown, plain text)."
      - "Identifiers and relationships must be explicit and diff-transparent."
      - "No opaque binary formats, databases, or proprietary tools."
      - "Version control (Git) must be the authoritative storage and history mechanism."
