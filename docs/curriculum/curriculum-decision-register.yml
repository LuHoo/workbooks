  - id: "CURR-011"
    title: "Learning objective granularity: chapter-level vs. section-level"
    domain:
      - "learning-objectives"
      - "curriculum-sequencing"
    decision: >
      Learning objectives may be defined at either chapter level (broader professional capabilities)
      or section level (targeted skills within a chapter). Both scopes are valid and should coexist.
      Student-facing materials should prioritize chapter-level objectives for clarity;
      section-level objectives support internal curriculum design.
    status: "inferred"
    confidence: "medium"
    rationale: >
      Students need a clear sense of what they should learn by chapter end (chapter-level).
      Instructors and curriculum designers need detailed tracking of skills within sections
      (section-level). These are distinct purposes that should not force artificial unity.
    implications:
      - "Chapters may have 5-7 chapter-level objectives and many more section-level objectives."
      - "Learning objective metadata must distinguish scope (chapter vs. section)."
      - "Student-facing displays should typically show chapter-level objectives."
      - "Coverage reports should track alignment at both levels."
    applies_to:
      - "learning-objectives"
      - "manuscript"
      - "chapters"
      - "sections"
    evidence:
