  - id: "CURR-001"
    title: "Single source of truth principle for educational content"
    domain:
      - "educational-purpose"
      - "curriculum-governance"
    decision: >
      Every educational concept must be authored exactly once in a canonical source.
      All other representations are generated from that source. No generated artefact
      may become an independent source of truth.
    status: "confirmed"
    confidence: "high"
    rationale: >
      This principle minimizes duplication, prevents divergence between educational
      artefacts (R notebooks, Python notebooks, book), and ensures that improvements
      to the canonical source automatically propagate throughout the ecosystem.
    implications:
      - "All curriculum corrections must be made at the earliest authoritative layer."
      - "Generated artifacts (distribution notebooks, book LaTeX) must never be manually edited."
      - "Workshop exercises, book chapters, and reference materials are derived, not authoritative."
      - "Generated content that diverges from the canonical source indicates a generation bug."
