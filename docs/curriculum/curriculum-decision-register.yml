        path: "docs/traceability/learning-objective-metadata-model.md"
        lines: "L34-L46"
        heading: "Core Entities"
        quotation: >
          `scope`: `chapter` or `section`.
          `section`: section number string when `scope = section` (for example `5.3`).
    related_decisions:
