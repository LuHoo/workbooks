  - id: "CURR-004"
    title: "Bloom taxonomy classification of learning objectives"
    domain:
      - "bloom-taxonomy"
      - "learning-objectives"
    decision: >
      Learning objectives are classified using Bloom's taxonomy cognitive levels.
      Each learning objective must be assigned exactly one Bloom level: remember, understand,
      apply, analyze, evaluate, or create.
    status: "confirmed"
    confidence: "high"
    rationale: >
      Bloom classification enables curricular alignment analysis and helps ensure
      that learning activities and assessment match the intended cognitive demand.
    implications:
      - "Every learning objective record requires a bloom field."
      - "Published materials may display Bloom level labels alongside objectives."
      - "Learning objective progressions should reflect intended cognitive escalation."
      - "Assessment methods should align with Bloom level (remember vs. evaluate require different activities)."
    applies_to:
      - "learning-objectives"
      - "assessment"
    evidence:
