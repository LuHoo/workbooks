  - id: "CURR-014"
    title: "Validation must fail loudly for unresolved references"
    domain:
      - "curriculum-governance"
      - "quality-assurance"
    decision: >
      Automated validation of curriculum metadata must detect and loudly report any
      broken or ambiguous references, such as: learning objectives with no mapped
      exercises or questions, exercises without objective links, IDs that do not exist.
      Validation failures must block publication.
    status: "confirmed"
    confidence: "high"
    rationale: >
      Silent failures in curriculum traceability create undetectable gaps in learning
      or assessment. Loud, visible validation ensures that gaps are noticed and
      resolved before student-facing materials are published.
    implications:
      - "All curriculum artifacts must pass validation before deployment."
      - "Validation errors must be human-readable and actionable."
      - "Curriculum maintenance must include regular validation runs."
      - "CI/CD pipelines must include curriculum validation gates."
